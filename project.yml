name: VeilLink
options:
  bundleIdPrefix: studio.zeo
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  VeilLink:
    type: application
    platform: iOS
    sources:
      - path: VeilLink
    dependencies:
      - sdk: libsqlite3.tbd
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.zeo.veillink
        PRODUCT_NAME: VeilLink
        INFOPLIST_FILE: VeilLink/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - VeilLinkTests
  VeilLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VeilLinkTests
    dependencies:
      - target: VeilLink
