<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"/>
<title>VeilScreen R1 · UI Preview</title>
<style>
:root {font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;color-scheme:dark;--gold:#ddbe7e;--panel:#131b20;--line:#33404a;--muted:#929faa;--bg:#090e12}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#212c32 0%,#080c10 65%);color:#edf1f2}.app{max-width:440px;min-height:100vh;margin:auto;padding:14px 12px 27px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 8px 16px}.top b{letter-spacing:.5px;font-size:15px}.muted{color:var(--muted);font-size:12px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:2px;color:var(--gold)}.headmark{color:var(--gold);font-size:23px}.hint{padding:12px 9px;color:#91a1ac;font-size:11px}.history{display:flex;flex-direction:column;gap:14px;flex:1;padding:16px 4px}.bubble{border-radius:18px;padding:12px 15px;max-width:78%;background:#182127;align-self:flex-start;font-size:14px}.bubble.me{align-self:flex-end;background:#3a3327}.card{border:1px solid #343c3e;background:linear-gradient(150deg,#1c2527,#11191e);border-radius:22px;padding:17px;box-shadow:0 20px 35px #0003}.cardheader{display:flex;align-items:center;gap:11px}.sicon{background:var(--gold);color:#131313;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;font-size:21px}.cardheader strong{font-size:16px}.caption{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.4px}.status{font-size:14px;font-weight:600;margin-top:17px}.desc{font-size:12px;color:#9eaaae;line-height:1.7;margin:9px 0 14px}.actions{display:flex;gap:9px}.button{background:#27323a;border:1px solid #354049;color:#f5f5f5;border-radius:13px;padding:11px 10px;font-size:12px;font-weight:650;min-height:45px;flex:1;cursor:pointer}.button.gold{background:var(--gold);border-color:var(--gold);color:#141414}.button.red{background:#642a2a;border-color:#733333}.button:active{transform:scale(.99)}.composer{border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:15px 4px}.plus{display:grid;place-items:center;height:41px;width:41px;border-radius:50%;background:var(--gold);color:#151515;font-size:25px;flex:none}.field{background:#131b20;border:1px solid #344048;border-radius:22px;height:42px;flex:1;color:#6d7880;padding:12px 16px;font-size:13px}.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:#182126;border:1px solid #34424b;border-radius:24px 24px 0 0;padding:18px 18px 24px;box-shadow:0 -22px 60px #0009}.sheet .button{width:100%;text-align:left;flex:none}.sheettitle{font-weight:650;font-size:15px;margin:4px 0 13px}.hidden{display:none!important}.view{position:fixed;inset:0;background:#050709;display:flex;flex-direction:column}.viewheader{padding:calc(env(safe-area-inset-top) + 14px) 20px 15px;display:flex;align-items:center;justify-content:space-between;background:#0e1318}.viewimage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}.mock{width:min(70%,270px);height:min(70%,510px);border:2px solid #4e5660;border-radius:24px;background:#202d38;overflow:hidden;display:flex;flex-direction:column}.mock .mhead{height:26%;background:linear-gradient(160deg,#46647d,#182a40);padding:24px 15px;font-size:22px;font-weight:650}.mock .blocks{padding:18px 14px;display:grid;gap:12px}.mock .line{height:10px;border-radius:7px;background:#728da4;opacity:.7}.viewfooter{background:#141c20;padding:17px 20px calc(env(safe-area-inset-bottom) + 16px);text-align:center;color:#9caaae;font-size:12px}.seg{display:flex;margin:13px 7px 0;gap:8px}.seg .button{font-size:11px;min-height:36px;padding:8px}.seg .chosen{border-color:var(--gold)}.watermark{background:#222d30;color:#b1bfc3;padding:5px 10px;border-radius:7px;font-size:10px;letter-spacing:.4px}
</style></head><body>
<div class="app"><div class="top"><span class="headmark">‹</span><div><b>VeilLink · 好友</b><div class="caption">端到端加密对话</div></div><span class="eyebrow">E2EE</span></div>
<div class="seg"><button class="button chosen" id="senderTab" onclick="switchRole('sender')">我是发起方</button><button class="button" id="viewerTab" onclick="switchRole('viewer')">我是接收方</button></div>
<div class="hint">VeilScreen R1 · 可点击的界面原型，仅演示 UI，不会连接蓝牙或录制屏幕。</div>
<div class="history"><div class="bubble">能帮我看一下这个界面吗？</div><div class="bubble me">可以，我发起屏幕共享。</div><div id="card" class="card hidden"><div class="cardheader"><div class="sicon">▣</div><div><strong>VeilScreen</strong><div class="caption">蓝牙直连 · E2EE · 无声音</div></div></div><div class="status" id="status"></div><div class="desc" id="desc"></div><div class="actions" id="actions"></div></div></div>
<div class="composer"><button class="button plus" onclick="toggleMenu()">+</button><div class="field">加密消息</div><span>↑</span></div></div>
<div class="sheet hidden" id="menu"><div class="sheettitle">添加到聊天</div><button class="button" onclick="invite()">▣　邀请屏幕共享</button><button class="button" onclick="toggleMenu()">▧　照片图库</button><button class="button" onclick="toggleMenu()">□　取消</button></div>
<div class="sheet hidden" id="consent"><div class="sheettitle">共享你的系统屏幕</div><p class="desc">系统屏幕可能出现聊天、通知和私人内容。只有你在苹果系统中明确授权后才能开始。本演示不会打开真实录屏。</p><button class="button gold" onclick="demoAuthorize()">继续 · 模拟系统授权成功</button><button class="button" onclick="closeConsent()">取消</button></div>
<div class="view hidden" id="viewerScreen"><div class="viewheader"><div><strong>VeilScreen</strong><div class="caption" id="fresh">上一帧 1.2 秒前 · BLE</div></div><button class="button red" onclick="stop()">结束观看</button></div><div class="viewimage" onclick="this.querySelector('.mock').style.transform=this.querySelector('.mock').style.transform?'':'scale(1.5)'"><div class="mock"><div class="mhead">示例屏幕<span style="font-size:10px;display:block;opacity:.7">不包含真实图像</span></div><div class="blocks"><div class="line" style="width:82%"></div><div class="line" style="width:95%"></div><div class="line" style="width:65%"></div><div class="line" style="width:88%"></div><div class="line" style="width:40%"></div></div></div></div><div class="viewfooter">🔒 仅观看 · 无声音 · 不保存<br/><br/>点击画面可模拟放大</div></div>
<script>
let role='sender',phase='idle';const $=id=>document.getElementById(id);function toggleMenu(){$('menu').classList.toggle('hidden')}
function switchRole(r){role=r;phase='idle';$('senderTab').classList.toggle('chosen',r==='sender');$('viewerTab').classList.toggle('chosen',r==='viewer');$('card').classList.add('hidden');$('viewerScreen').classList.add('hidden');$('menu').classList.add('hidden');if(r==='viewer')incoming()}
function setCard(status,desc,actions){$('card').classList.remove('hidden');$('status').textContent=status;$('desc').textContent=desc;$('actions').innerHTML='';for(const [label,fn,kind] of actions){const b=document.createElement('button');b.textContent=label;b.className='button '+(kind||'');b.onclick=fn;$('actions').appendChild(b)}}
function invite(){role='sender';$('menu').classList.add('hidden');phase='inviting';setCard('已发出邀请 · 等待好友确认','60 秒后邀请自动失效。对方接受不等于允许自动屏幕采集。', [['模拟好友接受',senderAccepted,'gold'],['撤销邀请',stop]])}
function incoming(){phase='incoming';setCard('好友邀请你观看屏幕','接受后，你需要等待对方主动确认系统屏幕授权。',[['拒绝',stop],['接受观看',accept,'gold']])}
function accept(){phase='waiting';setCard('已接受 · 等待对方开始共享','你已同意观看，但对方屏幕尚未开始发送。',[['模拟收到首帧',viewerReady,'gold'],['取消等待',stop]]);}
function senderAccepted(){role='sender';phase='accepted';setCard('对方已接受 · 等待你授权','现在还没有发送任何屏幕画面。',[['打开系统共享选择器',()=>{$('consent').classList.remove('hidden')},'gold'],['取消邀请',stop]])}
function demoAuthorize(){$('consent').classList.add('hidden');phase='ready';setCard('正在连接画面 · READY/ACK','系统采集已启动（模拟），仍在等待接收端确认。',[['模拟接收端确认',()=>{phase='live';setCard('正在共享 · 端到端加密','直播数据并不保存在聊天记录中。',[['停止共享',stop,'red']])},'gold'],['停止共享',stop]])}
function closeConsent(){$('consent').classList.add('hidden')}
function viewerReady(){phase='watching';setCard('已收到第一帧画面','上方 LIVE 只在接收端收到有效画面后显示。',[['查看共享屏幕',()=>{$('viewerScreen').classList.remove('hidden')},'gold'],['结束观看',stop]])}
function stop(){phase='ended';$('viewerScreen').classList.add('hidden');$('consent').classList.add('hidden');setCard('屏幕共享已结束','缓存帧已清除。新的共享必须重新邀请。',[])}
// Preview-only helper: switching roles lets both parties examine each surface.
$('viewerTab').addEventListener('contextmenu',e=>{e.preventDefault();viewerReady()});
// All demo transitions are explicit buttons; no real BLE or system capture.
</script></body></html>
