name: Validate archived VeilLink 26.9 Build 55 hotfix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-hotfix:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record immutable validation baseline
        run: |
          set -euo pipefail
          echo "BASE_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Reconstruct and verify audited hotfix commit
        run: |
          set -euo pipefail
          BUNDLE=.github/workflows/VeilLink-build55-hotfix.bundle
          git bundle verify "$BUNDLE"
          git fetch "$BUNDLE" HEAD:refs/remotes/hotfix/build55
          test "$(git rev-parse refs/remotes/hotfix/build55)" = "087c4af9695923a14df645b95dbfff693fb8575c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick refs/remotes/hotfix/build55

      - name: Verify cumulative recovery and focus-crash guards
        run: |
          set -euo pipefail
          python3 scripts/verify-recovery-lineage.py
          python3 scripts/verify-core-source-isolation.py
          python3 scripts/verify-local-control-plane.py
          python3 scripts/verify-control-plane-v2.py
          python3 scripts/verify-autoregulation-r7.py
          python3 scripts/verify-maintenance-r8.py
          python3 scripts/verify-ui-theme-r9.py
          python3 scripts/verify-voice-ptt-r10.py
          python3 scripts/verify-runtime-maintenance-r12.py
          grep -q 'VeilLegalAcknowledgmentField' VeilLink/UI/LegalConsentGateView.swift
          grep -q 'legal.consent.acknowledgment' VeilLink/UI/LegalConsentGateView.swift
          test "$(git diff HEAD^ --name-only | wc -l | tr -d ' ')" = "14"

      - name: Prove the archive validation cannot publish
        run: |
          set -euo pipefail
          test -n "$BASE_MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          echo "ARCHIVE_VALIDATION_ONLY=PASS"
          echo "No branch, tag, release, or artifact was published."
