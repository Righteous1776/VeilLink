name: Apply V0.3.13 update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify base and patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "aadb80b02e2fc4eeab3d4032d392cd37267e82fc"
          test "$(sha256sum VeilLink_V0.3.13_BLE_ReliabilityOverhaul_CUMULATIVE_FROM_aadb80b0.patch | cut -d' ' -f1)" = "4e059ca23fe78606681e9fb412f779a791a9731f1c243a4ad82835a5b8a474a6"
          git apply --check --verbose VeilLink_V0.3.13_BLE_ReliabilityOverhaul_CUMULATIVE_FROM_aadb80b0.patch
      - name: Apply exact update
        shell: bash
        run: |
          set -euo pipefail
          git apply --verbose VeilLink_V0.3.13_BLE_ReliabilityOverhaul_CUMULATIVE_FROM_aadb80b0.patch
          git apply --reverse --check VeilLink_V0.3.13_BLE_ReliabilityOverhaul_CUMULATIVE_FROM_aadb80b0.patch
          if ! grep -q '^## App easter egg$' README.md; then
            printf '\n## App easter egg\n\nThe creator left a hidden easter egg inside VeilLink. Its trigger and contents are intentionally undocumented—explore the app to discover it.\n\n作者在 App 里留下了一个隐藏彩蛋。这里仅确认它存在，触发方式与内容留给你在应用中发现。\n' >> README.md
          fi
          rm VeilLink_V0.3.13_BLE_ReliabilityOverhaul_CUMULATIVE_FROM_aadb80b0.patch
          rm .github/workflows/apply-v0313.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update to V0.3.13 BLE reliability overhaul"
          git push
