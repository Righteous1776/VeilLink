name: Sync V0.2.2 source

on:
  push:
    branches: [main]
    paths:
      - VeilLink_V0.2.2_CHECKPOINT_RuntimeStability.zip
      - .github/workflows/sync-v022.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source checkpoint
        run: |
          rm -rf "$RUNNER_TEMP/veillink-v022"
          mkdir -p "$RUNNER_TEMP/veillink-v022"
          unzip -q VeilLink_V0.2.2_CHECKPOINT_RuntimeStability.zip -d "$RUNNER_TEMP/veillink-v022"
          rsync -a "$RUNNER_TEMP/veillink-v022/veillink_v02/" ./
      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Source is already current."
            exit 0
          fi
          git commit -m "Replace source with V0.2.2 runtime stability checkpoint"
          git push
