name: Agent Inbox Gate

on:
  pull_request:
    paths:
      - 'AGENT_INBOX/**'

permissions:
  contents: read

jobs:
  validate-agent-drop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Inbox-only submission
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          ACTIVATION_SHA = 'c81f266e0032a1d0868cb25ddc26b690ddea4e43'
          REQUIRED = {'MANIFEST.md', 'PROPOSAL.md', 'PATCH.diff', 'TEST_PLAN.md', 'RISKS.md'}

          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']
          head_ref = os.environ['HEAD_REF']
          title = os.environ['PR_TITLE']

          def fail(message):
              print(f'::error title=Agent Inbox Gate::{message}')
              raise SystemExit(1)

          changed = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines()
          changed = [p.strip() for p in changed if p.strip()]
          if not changed:
              fail('PR has no changed files')

          is_drop = head_ref.startswith('agent-drop/')
          is_admin = head_ref.startswith('admin/')

          if not is_drop:
              if not is_admin:
                  fail(f'AGENT_INBOX changes require agent-drop/* or admin/* branch: {head_ref}')
              if any(p.startswith('AGENT_INBOX/submissions/') for p in changed):
                  fail('admin governance PR must not write agent submission payloads')
              print('VEILLINK_AGENT_INBOX_ADMIN_GATE_PASS')
              print(f'BRANCH={head_ref}')
              print(f'CHANGED_FILES={len(changed)}')
              raise SystemExit(0)

          if not title.startswith('[AGENT-DROP]'):
              fail(f'PR title must start with [AGENT-DROP]: {title}')

          roots = set()
          for path in changed:
              parts = Path(path).parts
              if len(parts) < 5 or parts[0:2] != ('AGENT_INBOX', 'submissions'):
                  fail(f'out-of-bounds path: {path}')
              if parts[2].startswith('_') or parts[2] == 'README.md':
                  fail(f'reserved agent id in path: {path}')
              roots.add('/'.join(parts[:4]))

          if len(roots) != 1:
              fail(f'one PR must contain exactly one submission root, found: {sorted(roots)}')

          root = next(iter(roots))
          root_path = Path(root)
          present = {p.name for p in root_path.iterdir() if p.is_file()}
          missing = sorted(REQUIRED - present)
          if missing:
              fail(f'required submission files missing from final package: {missing}')

          manifest_path = root_path / 'MANIFEST.md'
          manifest = manifest_path.read_text(encoding='utf-8')
          match = re.search(r'base_main_sha:\s*`?([0-9a-fA-F]{40})`?', manifest)
          if not match:
              fail('MANIFEST.md must contain a 40-hex base_main_sha')
          manifest_sha = match.group(1).lower()

          for sha, label in ((ACTIVATION_SHA, 'Inbox activation'), (manifest_sha, 'manifest base_main_sha')):
              if subprocess.call(['git', 'cat-file', '-e', f'{sha}^{{commit}}'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) != 0:
                  fail(f'{label} commit is not available in repository history: {sha}')

          if subprocess.call(['git', 'merge-base', '--is-ancestor', ACTIVATION_SHA, manifest_sha], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) != 0:
              fail('base_main_sha predates Agent Inbox V1 activation')
          if subprocess.call(['git', 'merge-base', '--is-ancestor', manifest_sha, base], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) != 0:
              fail('base_main_sha is not an ancestor of the PR base main SHA')

          for path in changed:
              p = Path(path)
              if not p.exists():
                  continue
              if p.stat().st_size > 2 * 1024 * 1024:
                  fail(f'file exceeds 2 MiB Inbox limit: {path}')
              if b'\x00' in p.read_bytes():
                  fail(f'binary content is forbidden in Agent Inbox: {path}')

          print('VEILLINK_AGENT_INBOX_GATE_PASS')
          print(f'BRANCH={head_ref}')
          print(f'SUBMISSION_ROOT={root}')
          print(f'BASE_MAIN_SHA={manifest_sha}')
          print(f'CHANGED_FILES={len(changed)}')
          PY
