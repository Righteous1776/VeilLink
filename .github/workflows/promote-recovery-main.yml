name: Promote verified VeilLink 26.9 recovery to main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source and preserve pre-promotion main
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(git rev-parse HEAD)"
          git fetch origin recovery/26.9-build54-i12
          RECOVERY_HEAD="$(git rev-parse origin/recovery/26.9-build54-i12)"
          test "$RECOVERY_HEAD" = "a0b023bcb08aa880a95e6d6ba4a839012f9e734a"
          git push origin \
            "$CURRENT_MAIN:refs/heads/backup/main-before-26.9-recovery-20261001"
          printf 'CURRENT_MAIN=%s\n' "$CURRENT_MAIN" >> "$GITHUB_ENV"
          printf 'RECOVERY_HEAD=%s\n' "$RECOVERY_HEAD" >> "$GITHUB_ENV"

      - name: Re-run cumulative recovery invariants
        run: |
          set -euo pipefail
          git checkout --detach "$RECOVERY_HEAD"
          python3 scripts/verify-recovery-lineage.py
          python3 scripts/verify-core-source-isolation.py
          python3 scripts/verify-local-control-plane.py
          python3 scripts/verify-control-plane-v2.py
          python3 scripts/verify-autoregulation-r7.py
          python3 scripts/verify-maintenance-r8.py
          python3 scripts/verify-ui-theme-r9.py
          python3 scripts/verify-voice-ptt-r10.py
          python3 scripts/verify-runtime-maintenance-r12.py
          git diff --exit-code --name-status 4042281..HEAD --diff-filter=D

      - name: Promote verified recovery with lease protection
        run: |
          set -euo pipefail
          git push origin \
            "$RECOVERY_HEAD:refs/heads/main" \
            "--force-with-lease=refs/heads/main:$CURRENT_MAIN"
