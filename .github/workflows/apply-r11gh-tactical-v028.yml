name: Apply R11-GH Tactical V0.2.8

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r11gh-tactical-v028-main
  cancel-in-progress: false

env:
  CARRIER_PATH: .github/workflows/R11GH_TacticalV028_B04D_fixed.zip
  CARRIER_SHA256: 376cb40c2aa25a9083b2ad508a2cfc0c86a4e5fcd42305e8ad7d99ba990babfe

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply guarded carrier
        shell: bash
        run: |
          set -euo pipefail
          echo "${CARRIER_SHA256}  ${CARRIER_PATH}" | sha256sum -c -
          carrier_dir="${RUNNER_TEMP}/r11gh-tactical"
          mkdir -p "${carrier_dir}"
          unzip -q "${CARRIER_PATH}" -d "${carrier_dir}"
          package_dir="${carrier_dir}/VeilLink_R11GH_TACTICAL_V028_B04D_INTEGRATION"
          (cd "${package_dir}" && sha256sum -c SHA256SUMS.txt)
          python3 "${package_dir}/apply_r11gh_tactical_v028.py"
          git restore --source=HEAD --staged --worktree .github/workflows
          git diff --check
          python3 scripts/verify-tactical-v2-assets.py --repo-root .

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release R11-GH with Tactical V0.2.8 B04D"
          git push origin HEAD:main
