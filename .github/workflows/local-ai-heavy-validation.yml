name: Real Local AI heavy validation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  LLAMA_CPP_COMMIT: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
  IOS_MIN_OS_VERSION: '15.0'
  QWEN_MODEL_SHA256: da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4
  QWEN_MODEL_REVISION: a41486f827d17edd055fe6b3b0ba3f8d427c0519

jobs:
  preflight:
    uses: ./.github/workflows/ios-ci.yml

  real-local-ai:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: |
          mkdir -p ci-artifacts
          {
            echo "HEAD=$(git rev-parse HEAD)"
            xcodebuild -version
            sw_vers
            df -h .
          } 2>&1 | tee ci-artifacts/environment.log

      - name: Install build tools
        run: brew install xcodegen cmake 2>&1 | tee ci-artifacts/install-build-tools.log

      - name: Build pinned llama.cpp and fetch pinned Qwen model
        run: |
          set -o pipefail
          bash scripts/prepare-real-local-ai.sh 2>&1 | tee ci-artifacts/prepare-real-local-ai.log

      - name: Generate local-AI Xcode project
        run: |
          set -o pipefail
          {
            xcodegen generate --spec project.local-ai.yml
            bash scripts/verify-local-ai-project.sh
          } 2>&1 | tee ci-artifacts/local-ai-project.log
          cp VeilLink.xcodeproj/project.pbxproj ci-artifacts/project.local-ai.pbxproj

      - name: Build simulator with real llama runtime
        run: |
          set -o pipefail
          rm -rf ci-artifacts/AI-SimulatorBuild.xcresult
          xcodebuild             -project VeilLink.xcodeproj             -scheme VeilLink             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -resultBundlePath ci-artifacts/AI-SimulatorBuild.xcresult             CODE_SIGNING_ALLOWED=NO             build 2>&1 | tee ci-artifacts/ai-simulator-build.log

      - name: Run full tests including real Qwen inference smoke test
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          bash scripts/ci-test.sh 2>&1 | tee ci-artifacts/AI_TEST.log
          grep -q 'VEILLINK_AI_METRICS_JSON=' ci-artifacts/AI_TEST.log
          grep 'VEILLINK_AI_METRICS_JSON=' ci-artifacts/AI_TEST.log | tail -n1 | sed 's/^.*VEILLINK_AI_METRICS_JSON=//' > AI_SMOKE_METRICS.json
          python3 -m json.tool AI_SMOKE_METRICS.json >/dev/null
          cp AI_SMOKE_METRICS.json ci-artifacts/

      - name: Build unsigned iPhoneOS app
        run: |
          set -o pipefail
          rm -rf DerivedData ci-artifacts/AI-DeviceBuild.xcresult
          xcodebuild             -project VeilLink.xcodeproj             -scheme VeilLink             -configuration Release             -sdk iphoneos             -derivedDataPath DerivedData             -resultBundlePath ci-artifacts/AI-DeviceBuild.xcresult             CODE_SIGNING_ALLOWED=NO             build 2>&1 | tee ci-artifacts/ai-device-build.log

      - name: Verify real local AI is inside app
        run: |
          set -o pipefail
          bash scripts/verify-real-local-ai-app.sh 2>&1 | tee ci-artifacts/verify-real-local-ai-app.log

      - name: Write validation report
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          app = pathlib.Path('DerivedData/Build/Products/Release-iphoneos/VeilLink.app/VeilLink')
          report = {
              'schema': 1,
              'result': 'PASS',
              'llama_cpp_commit': os.environ['LLAMA_CPP_COMMIT'],
              'ios_minimum': os.environ['IOS_MIN_OS_VERSION'],
              'model': 'Qwen3-0.6B-Q4_0.gguf',
              'model_sha256': os.environ['QWEN_MODEL_SHA256'],
              'model_revision': os.environ['QWEN_MODEL_REVISION'],
              'real_inference_smoke_test': 'PASS',
              'smoke_metrics': json.loads(pathlib.Path('AI_SMOKE_METRICS.json').read_text()),
              'device_app_build': 'PASS',
              'app_executable_sha256': hashlib.sha256(app.read_bytes()).hexdigest(),
              'release_eligible': False,
              'release_gate': 'Final IPA must come from MaleCNS + Qwen dual-brain heavy validation',
              'git_head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
          }
          pathlib.Path('AI_RUNTIME_VALIDATION.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          cp AI_RUNTIME_VALIDATION.json ci-artifacts/

      - name: Collect heavy-validation evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -d TestResults.xcresult ]; then
            ditto TestResults.xcresult ci-artifacts/TestResults.xcresult
          fi
          for f in AI_RUNTIME_VALIDATION.json AI_SMOKE_METRICS.json VeilLink/Resources/LocalAIProvenance.json; do
            if [ -f "$f" ]; then cp "$f" ci-artifacts/; fi
          done
          python3 scripts/ci-collect-evidence.py             --workflow "Real Local AI heavy validation"             --phase "real-local-ai"             --status "$JOB_STATUS"             --artifact-dir ci-artifacts             --output ci-artifacts/CI_EVIDENCE.json

      - name: Upload heavy-validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeilLink-RealLocalAI-Evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload successful runtime validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeilLink-RealLocalAI-Validation
          path: |
            AI_RUNTIME_VALIDATION.json
            AI_SMOKE_METRICS.json
            VeilLink/Resources/LocalAIProvenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
