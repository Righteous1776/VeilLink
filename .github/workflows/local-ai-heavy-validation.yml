name: Real Local AI heavy validation

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'VeilLink/**'
      - 'VeilLinkTests/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/local-ai-heavy-validation.yml'
  pull_request:
    paths:
      - 'VeilLink/**'
      - 'VeilLinkTests/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/local-ai-heavy-validation.yml'

permissions:
  contents: read

env:
  LLAMA_CPP_COMMIT: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
  IOS_MIN_OS_VERSION: '15.0'
  QWEN_MODEL_SHA256: da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4
  QWEN_MODEL_REVISION: a41486f827d17edd055fe6b3b0ba3f8d427c0519

jobs:
  real-local-ai:
    runs-on: macos-15
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen cmake

      - name: Build pinned llama.cpp and fetch pinned Qwen model
        run: bash scripts/prepare-real-local-ai.sh

      - name: Generate local-AI Xcode project
        run: |
          xcodegen generate --spec project.local-ai.yml
          bash scripts/verify-local-ai-project.sh

      - name: Build simulator with real llama runtime
        run: |
          set -o pipefail
          xcodebuild \
            -project VeilLink.xcodeproj \
            -scheme VeilLink \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run full tests including real Qwen inference smoke test
        run: |
          set -o pipefail
          bash scripts/ci-test.sh 2>&1 | tee AI_TEST.log
          grep -q 'VEILLINK_AI_METRICS_JSON=' AI_TEST.log
          grep 'VEILLINK_AI_METRICS_JSON=' AI_TEST.log | tail -n1 | sed 's/^.*VEILLINK_AI_METRICS_JSON=//' > AI_SMOKE_METRICS.json
          python3 -m json.tool AI_SMOKE_METRICS.json >/dev/null

      - name: Build unsigned iPhoneOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project VeilLink.xcodeproj \
            -scheme VeilLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify real local AI is inside app
        run: bash scripts/verify-real-local-ai-app.sh

      - name: Write validation report
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          app = pathlib.Path('DerivedData/Build/Products/Release-iphoneos/VeilLink.app/VeilLink')
          report = {
              'schema': 1,
              'result': 'PASS',
              'llama_cpp_commit': os.environ['LLAMA_CPP_COMMIT'],
              'ios_minimum': os.environ['IOS_MIN_OS_VERSION'],
              'model': 'Qwen3-0.6B-Q4_0.gguf',
              'model_sha256': os.environ['QWEN_MODEL_SHA256'],
              'model_revision': os.environ['QWEN_MODEL_REVISION'],
              'real_inference_smoke_test': 'PASS',
              'smoke_metrics': json.loads(pathlib.Path('AI_SMOKE_METRICS.json').read_text()),
              'device_app_build': 'PASS',
              'app_executable_sha256': hashlib.sha256(app.read_bytes()).hexdigest(),
              'release_eligible': False,
              'release_gate': 'Final IPA must come from MaleCNS + Qwen dual-brain heavy validation',
              'git_head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
          }
          pathlib.Path('AI_RUNTIME_VALIDATION.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: VeilLink-RealLocalAI-Validation
          path: |
            AI_RUNTIME_VALIDATION.json
            AI_SMOKE_METRICS.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
