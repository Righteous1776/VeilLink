name: One-time Vertex 35M GGUF import (isolated branch)

on:
  push:
    branches:
      - integration/lingcore-vertex35m-model-20261108
    paths:
      - .github/workflows/lingcore-vertex35m-one-time-import.yml

permissions:
  contents: write

jobs:
  import-verified-model:
    if: github.repository == 'Righteous1776/VeilLink' && github.ref == 'refs/heads/integration/lingcore-vertex35m-model-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/lingcore-vertex35m-model-20261108
          persist-credentials: true
      - name: Download exact GGUF and verify bytes and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          dest="VeilLink/Resources/LocalAI/Vertex-0.6-35M-Instruct-Q4_K_M.gguf"
          mkdir -p "$(dirname "$dest")"
          if test -f "$dest"; then
            echo "Model already tracked; verifying, never silently overwriting."
          else
            tmp="$(mktemp)"
            trap 'rm -f "$tmp"' EXIT
            curl -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 360 \
              "https://huggingface.co/VertexResearch/Vertex-0.6-35M-Instruct-GGUF/resolve/main/Vertex-0.6-35M-Instruct-Q4_K_M.gguf?download=true" \
              -o "$tmp"
            mv "$tmp" "$dest"
          fi
          python3 - "$dest" <<'PY'
          import hashlib, pathlib, struct, sys
          p=pathlib.Path(sys.argv[1])
          expected_size=29203168
          expected_sha="c55c3c32740d5a283c505fc9f9b7313e4b3f0c98bb11efd21b651651d5cb36b5"
          assert p.stat().st_size==expected_size, f"size mismatch: {p.stat().st_size}"
          with p.open("rb") as f:
              assert f.read(8)==b"GGUF"+struct.pack("<I",3), "invalid GGUF v3 header"
              f.seek(0)
              h=hashlib.sha256()
              for block in iter(lambda:f.read(1<<20),b""):
                  h.update(block)
          assert h.hexdigest()==expected_sha, f"SHA-256 mismatch: {h.hexdigest()}"
          print(f"VERIFIED_MODEL_SHA256={h.hexdigest()}")
          PY
      - name: Commit only verified model to isolated integration branch
        shell: bash
        run: |
          set -euo pipefail
          model="VeilLink/Resources/LocalAI/Vertex-0.6-35M-Instruct-Q4_K_M.gguf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$model"
          if git diff --cached --quiet; then
            echo "Verified asset already present."
          else
            git commit -m "asset(vertex35m): import pinned 29MB GGUF to isolated branch [skip ci]"
            git push origin "HEAD:refs/heads/integration/lingcore-vertex35m-model-20261108"
          fi
