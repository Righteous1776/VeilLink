name: Fast unsigned iPhoneOS IPA candidate (Wave 3)

on:
  push:
    branches:
      - ci/20261115-wave3-rapid-unsigned-ipa

permissions:
  contents: read

concurrency:
  group: fast-ipa-wave3
  cancel-in-progress: true

jobs:
  unsigned-device-ipa:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Record source and run static preflight
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          xcodebuild -version
          python3 scripts/ci-standard-preflight.py

      - name: Install XcodeGen and CMake
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen cmake

      - name: Generate native iOS project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Build unsigned iPhoneOS Release directly (skip simulator)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project VeilLink.xcodeproj \
            -scheme VeilLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package and validate genuine device IPA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-unsigned-ipa.sh
          python3 scripts/verify-core-release.py \
            --app DerivedData/Build/Products/Release-iphoneos/VeilLink.app \
            --ipa build/VeilLink-unsigned.ipa \
            --manifest CORE_RELEASE_MANIFEST.json \
            --provenance CORE_RELEASE_PROVENANCE.json \
            --sums CORE_RELEASE_SHA256SUMS.txt
          shasum -a 256 build/VeilLink-unsigned.ipa

      - name: Publish candidate artifact, not a release
        uses: actions/upload-artifact@v4
        with:
          name: VeilLink-Wave3-rapid-unsigned-iphoneos
          path: |
            build/VeilLink-unsigned.ipa
            CORE_RELEASE_MANIFEST.json
            CORE_RELEASE_PROVENANCE.json
            CORE_RELEASE_SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
