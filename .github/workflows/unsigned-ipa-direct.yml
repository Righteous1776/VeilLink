name: V29 parallel device candidate (not publication)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  direct-release:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Prepare evidence
        run: |
          mkdir -p ci-artifacts
          {
            echo "HEAD=$(git rev-parse HEAD)"
            xcodebuild -version
            sw_vers
            echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
            df -h .
            du -sh VeilLink/Resources
          } 2>&1 | tee ci-artifacts/environment.log

      - name: Static standard preflight
        run: |
          set -o pipefail
          python3 scripts/ci-standard-preflight.py 2>&1 | tee ci-artifacts/static-preflight.log

      - name: Install XcodeGen
        run: |
          set -o pipefail
          brew install xcodegen 2>&1 | tee ci-artifacts/install-xcodegen.log

      - name: Reuse exact pinned successful native device runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Righteous1776/VeilLink/actions/runs/42397878336 \
            --jq '.head_sha == "cdd9faeaa58533be786acaa00bd89179157a7a60" and .conclusion == "success"' | grep -qx true
          gh api repos/Righteous1776/VeilLink/actions/artifacts/13585396616/zip > "$RUNNER_TEMP/v29-native-source.zip"
          echo "d84a418fbb9565cd024c6142f001b1be3b231837c3c836fd48171a19945b3f88  $RUNNER_TEMP/v29-native-source.zip" | shasum -a 256 -c -
          python3 - "$RUNNER_TEMP/v29-native-source.zip" "$RUNNER_TEMP/v29-native-source.ipa" <<'PY'
          import sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              ipas = [n for n in z.namelist() if n.endswith('.ipa')]
              assert len(ipas) == 1
              Path(sys.argv[2]).write_bytes(z.read(ipas[0]))
          PY
          ditto -x -k "$RUNNER_TEMP/v29-native-source.ipa" "$RUNNER_TEMP/v29-native-source"
          # Xcode strips Headers/Modules when embedding frameworks in an app.
          # Restore the EXACT upstream b29c606 interface for compilation; the
          # already-validated arm64 binary is unchanged, not recompiled.
          HEADER_SOURCE="$RUNNER_TEMP/v29-llama-headers"
          git init "$HEADER_SOURCE"
          git -C "$HEADER_SOURCE" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$HEADER_SOURCE" fetch --depth 1 --filter=blob:none origin b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          git -C "$HEADER_SOURCE" sparse-checkout set --no-cone '/include/' '/ggml/include/' '/tools/mtmd/*.h'
          git -C "$HEADER_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$HEADER_SOURCE" rev-parse HEAD)" = b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          python3 - "$HEADER_SOURCE" "$RUNNER_TEMP/v29-native-source/Payload/VeilLink.app/Frameworks/llama.framework" <<'PY'
          from pathlib import Path
          import shutil, sys
          src, framework = map(Path, sys.argv[1:])
          headers, modules = framework / 'Headers', framework / 'Modules'
          headers.mkdir(exist_ok=True); modules.mkdir(exist_ok=True)
          names = ['include/llama.h'] + ['ggml/include/' + n for n in
                   ['ggml.h', 'ggml-opt.h', 'ggml-alloc.h', 'ggml-backend.h',
                    'ggml-metal.h', 'ggml-cpu.h', 'ggml-blas.h', 'gguf.h']] + \
                  ['tools/mtmd/mtmd.h', 'tools/mtmd/mtmd-helper.h']
          for name in names:
              shutil.copyfile(src / name, headers / Path(name).name)
          (modules / 'module.modulemap').write_text('''framework module llama {
              umbrella "Headers"
              link "c++"
              link framework "Accelerate"
              link framework "Metal"
              link framework "Foundation"
              export *
          }
          ''')
          PY
          mkdir -p Vendor
          xcodebuild -create-xcframework \
            -framework "$RUNNER_TEMP/v29-native-source/Payload/VeilLink.app/Frameworks/llama.framework" \
            -output "$PWD/Vendor/llama.xcframework"
          python3 scripts/verify-vertex35m-model.py
          python3 scripts/make-vertex35m-project.py

      - name: Generate Core Xcode project
        run: |
          set -o pipefail
          xcodegen generate --spec project.vertex35m.yml 2>&1 | tee ci-artifacts/xcodegen-core.log
          cp VeilLink.xcodeproj/project.pbxproj ci-artifacts/project.core.pbxproj

      - name: Build unsigned Core iPhoneOS app
        run: |
          set -o pipefail
          rm -rf DerivedData ci-artifacts/Direct-Core-DeviceBuild.xcresult
          xcodebuild \
            -project VeilLink.xcodeproj \
            -scheme VeilLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            -resultBundlePath ci-artifacts/Direct-Core-DeviceBuild.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ci-artifacts/direct-core-device-build.log

      - name: Read built release identity
        id: release_identity
        run: |
          INFO="DerivedData/Build/Products/Release-iphoneos/VeilLink.app/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "VeilLink $VERSION · Build $BUILD" | tee ci-artifacts/release-identity.log

      - name: Package unsigned Core IPA
        run: |
          set -o pipefail
          bash scripts/package-unsigned-ipa.sh 2>&1 | tee ci-artifacts/package-core-ipa.log

      - name: Verify Core carrier and size budget
        run: |
          set -o pipefail
          python3 scripts/verify-core-release.py \
            --experimental-vertex \
            --app "DerivedData/Build/Products/Release-iphoneos/VeilLink.app" \
            --ipa "build/VeilLink-unsigned.ipa" \
            --manifest CORE_RELEASE_MANIFEST.json \
            --provenance CORE_RELEASE_PROVENANCE.json \
            --sums CORE_RELEASE_SHA256SUMS.txt 2>&1 \
            | tee ci-artifacts/core-release-gate.log
          cp \
            CORE_RELEASE_MANIFEST.json \
            CORE_RELEASE_PROVENANCE.json \
            CORE_RELEASE_SHA256SUMS.txt \
            ci-artifacts/

      - name: Collect evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 scripts/ci-collect-evidence.py \
            --workflow "Core unsigned direct release" \
            --phase "direct-release" \
            --status "$JOB_STATUS" \
            --artifact-dir ci-artifacts \
            --output ci-artifacts/CI_EVIDENCE.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeilLink-Direct-Release-Evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeilLink-v${{ steps.release_identity.outputs.version }}-b${{ steps.release_identity.outputs.build }}-CANDIDATE-PENDING-FULL-XCTEST
          path: |
            build/VeilLink-unsigned.ipa
            CORE_RELEASE_MANIFEST.json
            CORE_RELEASE_PROVENANCE.json
            CORE_RELEASE_SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
