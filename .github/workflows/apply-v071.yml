name: Apply V0.7.1 increment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate baseline and patch
        shell: bash
        run: |
          set -euo pipefail
          base="ecf0a39f27eca51e5be7f176af0b318869736eef"
          patch="VeilLink_V0.7.1_CUMULATIVE_FROM_ecf0a39f.patch"
          expected="6f930f14a79ee8c0d500bbfadb1eb249020b4519ee72a4ea6736d06401a22296"
          git merge-base --is-ancestor "$base" HEAD
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$expected"
          git apply --check "$patch"
          git apply --whitespace=error-all "$patch"
          git diff --check

      - name: Verify target source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f VeilLink_V0.7.1_CUMULATIVE_FROM_ecf0a39f.patch
          rm -f .github/workflows/apply-v071.yml
          git add -A
          test "$(git write-tree)" = "684cd7b3a2d7d388f7bd768570320b5c6f3fbcc1"
          bash -n scripts/local-ci-sim.sh
          bash -n scripts/ci-test.sh
          bash -n scripts/package-unsigned-ipa.sh

      - name: Commit V0.7.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release V0.7.1: tactical situation awareness"
          git push origin HEAD:main
