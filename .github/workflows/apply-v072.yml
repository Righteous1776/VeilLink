name: Apply verified V0.7.2 patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify and apply V0.7.2
        shell: bash
        run: |
          set -euo pipefail
          expected_head="3175feb5d9be7bfb1ae9838bffe03d39975db508"
          expected_patch_sha="fd3441a130281bfa204557ca1f41802701337052a1eb46e8cb067a3805651a6e"
          expected_tree="6035ce00d77d03f33b51cc3dfb984f329bf0c222"
          patch_file="VeilLink_V0.7.2_FROM_V0.7.1.patch"

          test "$(git rev-parse HEAD)" = "$expected_head"
          printf '%s  %s\n' "$expected_patch_sha" "$patch_file" | sha256sum -c -
          git apply --check --whitespace=error-all "$patch_file"
          git apply --whitespace=error-all "$patch_file"
          git diff --check
          bash -n scripts/*.sh
          test "$(/usr/lib/git-core/git-hash-object VeilLink/Resources/Info.plist)" != ""

          rm "$patch_file" .github/workflows/apply-v072.yml
          git add -A
          test "$(git write-tree)" = "$expected_tree"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release V0.7.2: optimize tactical render and BLE queues"
          git push origin HEAD:main
