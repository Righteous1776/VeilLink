name: Apply verified V0.9.3 checkpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release carrier and repository base
        env:
          EXPECTED_BASE: 0d9f54160c05c6ac2d672dda6f056bf831ef546d
          ARCHIVE: VeilLink_V0.9.3_FINAL_GITHUB_SOURCE_UPLOAD.zip
          EXPECTED_SHA256: c7e106356052aed8006417cad39958807c74b51d7d5efc4d8b73fdc174ae834b
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          git diff --quiet "$EXPECTED_BASE" HEAD -- . \
            ':(exclude)VeilLink_V0.9.3_FINAL_GITHUB_SOURCE_UPLOAD.zip' \
            ':(exclude).github/workflows/apply-v093.yml'
          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum --check --strict
          python3 - <<'PY'
          import os
          import zipfile

          archive = os.environ["ARCHIVE"]
          with zipfile.ZipFile(archive) as source:
              for name in source.namelist():
                  parts = [part for part in name.replace("\\", "/").split("/") if part]
                  if name.startswith("/") or ".." in parts or ".git" in parts:
                      raise SystemExit(f"unsafe archive entry: {name}")
                  if "__pycache__" in parts or name.endswith(".pyc"):
                      raise SystemExit(f"cache file in release archive: {name}")
          PY

      - name: Apply V0.9.3 source tree
        env:
          ARCHIVE: VeilLink_V0.9.3_FINAL_GITHUB_SOURCE_UPLOAD.zip
          EXPECTED_TREE: 4db6361e223a2ae8d527bfa672908cdd067ace8d
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/veillink-v093"
          mkdir -p "$release_dir"
          unzip -q "$ARCHIVE" -d "$release_dir"
          cp -a "$release_dir"/. ./
          git rm -f -- "$ARCHIVE" .github/workflows/apply-v093.yml
          git add -A
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$EXPECTED_TREE"

      - name: Validate checkpoint metadata and tools
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          python3 -m compileall -q Tools
          python3 Tools/VeilFlyBuilder/verify_vfly.py VeilLinkTests/Fixtures/MaleCNSFixture.vfly
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          with Path("VeilLink/Resources/Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          assert info["CFBundleShortVersionString"] == "0.9.3"
          assert info["CFBundleVersion"] == "36"
          PY
          if git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$)'; then
            echo "Python cache files must not be committed" >&2
            exit 1
          fi

      - name: Publish V0.9.3
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release V0.9.3: MaleCNS VFLY1 foundation"
          git push origin HEAD:main
