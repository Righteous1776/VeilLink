name: Apply V0.3.7 patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify expected base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7397c5374e559fecdde07601b7f09646faf33bb4"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/apply-v037.yml"

      - name: Decode, verify, dry-run and apply patch
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/v037.patch
          echo "d75c7fd36ae8db20036d0306956e69f544e9fecad2f7a77e8981532bcd6041c4  /tmp/v037.patch" | sha256sum -c -
          git apply --check --verbose /tmp/v037.patch
          git apply --verbose /tmp/v037.patch
          git apply --reverse --check /tmp/v037.patch

      - name: Commit exact patch
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v037.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply V0.3.7 iPhone 7 render compatibility"
          git push
