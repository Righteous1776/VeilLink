name: Zeo Foundation Checks

on:
  pull_request:
    paths:
      - 'governance/**'
      - 'tools/governance/**'
      - '.agents/skills/veillink-zeo-additive/**'
      - 'AGENT_INBOX/**'
      - '.github/workflows/zeo-foundation-checks.yml'

permissions:
  contents: read

jobs:
  additive-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Foundation regression fixtures
        run: python3 -m unittest discover -s tools/governance/tests -v
      - name: Supplemental learning check for new proposals
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          python3 tools/governance/check_new_submissions.py
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --head-ref "$HEAD_REF" --pr-title "$PR_TITLE"
